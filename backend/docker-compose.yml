services:
  postgres:
    image: postgres:16-alpine
    container_name: xchange-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: showpro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - iq-showpro-postgres:/var/lib/postgresql/data

volumes:
  iq-showpro-postgres:
